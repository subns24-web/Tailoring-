<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Assistant — Subha's Tailoring</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --card: #ffffff;
      --accent: #8a3324;
      --accent-soft: #f3e4df;
      --text: #2b2b2b;
      --muted: #7a746c;
      --border: #e5ddd2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
    }
    header {
      padding: 18px 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px 14px 0 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header p { font-size: 13px; color: var(--muted); font-style: italic; }
    #chat {
      flex: 1;
      overflow-y: auto;
      background: var(--card);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--accent-soft);
      border-bottom-left-radius: 4px;
    }
    .msg.bot.thinking { color: var(--muted); font-style: italic; }
    .msg.error { align-self: center; background: #fdeaea; color: #a33; font-size: 13px; }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 20px;
      background: var(--card);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    .suggestions button {
      font-family: inherit;
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }
    .suggestions button:hover { background: var(--accent-soft); }
    form {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 14px 14px;
    }
    input {
      flex: 1;
      font-family: inherit;
      font-size: 15px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--bg);
    }
    input:focus { border-color: var(--accent); }
    form button {
      font-family: inherit;
      font-size: 15px;
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    form button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">&#129525;</div>
      <div>
        <h1>Order Assistant</h1>
        <p>Subha's Tailoring &amp; Boutique — ask me about your orders</p>
      </div>
    </header>

    <div id="chat">
      <div class="msg bot">Hello! I can check your orders for you — status, tracking, delivery dates, payments and refunds. What would you like to know?</div>
    </div>

    <div class="suggestions" id="suggestions">
      <button>Where is my order?</button>
      <button>Show all my orders</button>
      <button>When will ORD-1002 be delivered?</button>
      <button>Did I get my refund for ORD-1004?</button>
    </div>

    <form id="form">
      <input id="input" type="text" placeholder="Ask about your orders..." autocomplete="off" />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const suggestions = document.getElementById("suggestions");

    // Conversation history in Anthropic messages format (text-only turns).
    let history = [];

    function addMessage(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function ask(question) {
      addMessage(question, "user");
      history.push({ role: "user", content: question });
      input.value = "";
      send.disabled = true;
      const thinking = addMessage("Checking your orders…", "bot thinking");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        thinking.remove();
        if (!res.ok) {
          addMessage(data.error || "Something went wrong.", "error");
          history.pop(); // let the user retry the same question
        } else {
          addMessage(data.reply, "bot");
          history = data.messages; // includes tool calls/results for context
        }
      } catch (err) {
        thinking.remove();
        addMessage("Could not reach the server. Is it running?", "error");
        history.pop();
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (q) ask(q);
    });

    suggestions.addEventListener("click", (e) => {
      if (e.target.tagName === "BUTTON") ask(e.target.textContent);
    });

    input.focus();
  </script>
</body>
</html>
