<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="TailorPro – Complete Tailoring Business Management">
  <title>TailorPro</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash" class="splash">
    <div class="splash-inner">
      <div class="splash-logo">
        <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="36" cy="36" r="36" fill="#c9a96e" opacity="0.15"/>
          <path d="M36 12 L44 24 L36 20 L28 24 Z" fill="#c9a96e"/>
          <path d="M28 24 L20 40 L36 36 L52 40 L44 24 Z" fill="#c9a96e" opacity="0.85"/>
          <path d="M20 40 L18 56 L36 50 L54 56 L52 40 Z" fill="#c9a96e" opacity="0.7"/>
          <circle cx="36" cy="36" r="4" fill="white"/>
          <line x1="36" y1="20" x2="36" y2="50" stroke="white" stroke-width="1.5" stroke-dasharray="3,3"/>
        </svg>
      </div>
      <h1 class="splash-title">TailorPro</h1>
      <p class="splash-subtitle">Smart Tailoring Management</p>
      <div class="splash-loader"><div class="loader-bar"></div></div>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="app hidden">
    <header id="app-header" class="app-header">
      <button id="back-btn" class="icon-btn back-btn hidden" aria-label="Go back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M5 12l7 7M5 12l7-7"/></svg>
      </button>
      <div class="header-title-wrap">
        <h1 id="page-title" class="page-title">Dashboard</h1>
        <span id="page-subtitle" class="page-subtitle hidden"></span>
      </div>
      <div class="header-actions">
        <button id="search-btn" class="icon-btn hidden" aria-label="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button id="notif-btn" class="icon-btn notif-btn" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span id="notif-badge" class="notif-badge hidden">0</span>
        </button>
      </div>
    </header>

    <main id="content" class="content"></main>

    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-item active" data-page="dashboard">
        <span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>
        <span class="nav-label">Home</span>
      </button>
      <button class="nav-item" data-page="customers">
        <span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
        <span class="nav-label">Customers</span>
      </button>
      <button class="nav-item nav-fab" data-page="new-order">
        <span class="nav-fab-inner"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
      </button>
      <button class="nav-item" data-page="orders">
        <span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
        <span class="nav-label">Orders</span>
      </button>
      <button class="nav-item" data-page="more">
        <span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></span>
        <span class="nav-label">More</span>
      </button>
    </nav>
  </div>

  <!-- Modal (bottom sheet) -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-sheet" class="modal-sheet">
      <div class="modal-handle"></div>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Full Screen Modal -->
  <div id="fullmodal-overlay" class="fullmodal-overlay hidden">
    <div id="fullmodal-content" class="fullmodal-content"></div>
  </div>

  <!-- Toasts -->
  <div id="toast-container" class="toast-container"></div>

  <script src="js/app.js"></script>
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
